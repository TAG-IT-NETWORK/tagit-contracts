[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

# ── Deploy profile (FOUNDRY_PROFILE=deploy) ─────────────────────────────────
# TAGITCore exceeds the EIP-170 runtime limit under legacy codegen since the
# batch lifecycle functions (25,308–26,076 B at runs 1–200 vs 24,576 max);
# via-ir emits 22,601 B (+1,975 B margin). Tests stay on legacy codegen
# because under via-ir solc CSE-caches block.timestamp across vm.warp(), so
# 13 time-dependent tests read stale time (exact 2x-elapsed failures — a
# test-harness artifact, not a contract defect; the batch lifecycle suite
# passes 51/51 under via-ir). ALL deploy/upgrade broadcasts of TAGITCore MUST
# use FOUNDRY_PROFILE=deploy or CREATE reverts with max-code-size-exceeded.
# Pre-mainnet follow-up: make the suite warp-robust so via-ir can be global,
# or extract the per-item lifecycle helpers into an external library.
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@forge-std/=lib/forge-std/src/",
    "@account-abstraction/=lib/account-abstraction/contracts/",
    "@chainlink/ccip/=lib/chainlink-local/lib/chainlink-ccip/chains/evm/contracts/"
]

[profile.deploy]
via_ir = true

# Test configuration - Pre-mainnet hardening (SEC-005)
[fuzz]
runs = 100000
max_test_rejects = 65536
seed = "0x333"

[invariant]
runs = 256
depth = 500
fail_on_revert = true

# Gas reporting
gas_reports = ["*"]

# RPC endpoints for fork testing and deployment
[rpc_endpoints]
optimism = "${OP_MAINNET_RPC_URL}"
optimism_sepolia = "${OP_SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base = "${BASE_MAINNET_RPC_URL}"
ethereum = "${ETH_MAINNET_RPC_URL}"

# Etherscan verification (multi-chain)
[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", url = "https://api-sepolia.arbiscan.io/api", chain = 421614 }
optimism_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia-optimistic.etherscan.io/api", chain = 11155420 }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api", chain = 84532 }
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }

# Fork configuration for reproducible tests
[profile.fork]
fork_block_number = 125000000
no_match_path = "test/unit/*"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
