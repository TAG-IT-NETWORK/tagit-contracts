name: Test Secrets & RPC Connection

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip running forge tests'
        required: false
        default: 'false'
        type: boolean

env:
  FOUNDRY_PROFILE: ci

jobs:
  validate-secrets:
    name: Validate Secrets & Fork Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Verify secrets are set
        id: check-secrets
        run: |
          echo "## Secrets Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SECRETS_OK=true

          if [ -z "${{ secrets.OP_SEPOLIA_RPC_URL }}" ]; then
            echo "::error::OP_SEPOLIA_RPC_URL secret is not set"
            echo "| OP_SEPOLIA_RPC_URL | :x: Not Set |" >> $GITHUB_STEP_SUMMARY
            SECRETS_OK=false
          else
            echo "✅ OP_SEPOLIA_RPC_URL is set"
            echo "| OP_SEPOLIA_RPC_URL | :white_check_mark: Set |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -z "${{ secrets.ETHERSCAN_API_KEY }}" ]; then
            echo "::error::ETHERSCAN_API_KEY secret is not set"
            echo "| ETHERSCAN_API_KEY | :x: Not Set |" >> $GITHUB_STEP_SUMMARY
            SECRETS_OK=false
          else
            echo "✅ ETHERSCAN_API_KEY is set"
            echo "| ETHERSCAN_API_KEY | :white_check_mark: Set |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -z "${{ secrets.SAFE_ADDRESS }}" ]; then
            echo "::error::SAFE_ADDRESS secret is not set"
            echo "| SAFE_ADDRESS | :x: Not Set |" >> $GITHUB_STEP_SUMMARY
            SECRETS_OK=false
          else
            echo "✅ SAFE_ADDRESS is set"
            echo "| SAFE_ADDRESS | :white_check_mark: Set |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -z "${{ secrets.PRIVATE_KEY }}" ]; then
            echo "::error::PRIVATE_KEY secret is not set"
            echo "| PRIVATE_KEY | :x: Not Set |" >> $GITHUB_STEP_SUMMARY
            SECRETS_OK=false
          else
            echo "✅ PRIVATE_KEY is set (not logged)"
            echo "| PRIVATE_KEY | :white_check_mark: Set |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$SECRETS_OK" = false ]; then
            echo "::error::One or more required secrets are missing"
            exit 1
          fi

      - name: Verify RPC connection & Chain ID
        id: verify-rpc
        run: |
          echo "## RPC Connection Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "🔗 Testing RPC connection to OP Sepolia..."

          CHAIN_ID=$(cast chain-id --rpc-url "${{ secrets.OP_SEPOLIA_RPC_URL }}" 2>/dev/null || echo "ERROR")

          if [ "$CHAIN_ID" = "ERROR" ]; then
            echo "::error::Failed to connect to RPC endpoint"
            echo "| RPC Connection | :x: Failed |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ RPC connection successful"
          echo "📍 Chain ID: $CHAIN_ID"

          if [ "$CHAIN_ID" != "11155420" ]; then
            echo "::error::Chain ID mismatch. Expected 11155420 (OP Sepolia), got $CHAIN_ID"
            echo "| Chain ID | :x: $CHAIN_ID (expected 11155420) |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ Chain ID verified: 11155420 (OP Sepolia)"
          echo "| RPC Connection | :white_check_mark: Connected |" >> $GITHUB_STEP_SUMMARY
          echo "| Chain ID | :white_check_mark: 11155420 (OP Sepolia) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check Safe balance
        id: check-safe
        run: |
          echo "## Safe Account Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          SAFE_ADDRESS="${{ secrets.SAFE_ADDRESS }}"
          echo "🔐 Checking Safe balance at: $SAFE_ADDRESS"

          BALANCE_WEI=$(cast balance "$SAFE_ADDRESS" --rpc-url "${{ secrets.OP_SEPOLIA_RPC_URL }}" 2>/dev/null || echo "ERROR")

          if [ "$BALANCE_WEI" = "ERROR" ]; then
            echo "::warning::Failed to fetch Safe balance"
            echo "| Safe Address | $SAFE_ADDRESS |" >> $GITHUB_STEP_SUMMARY
            echo "| Balance | :warning: Unable to fetch |" >> $GITHUB_STEP_SUMMARY
          else
            BALANCE_ETH=$(cast from-wei "$BALANCE_WEI" 2>/dev/null || echo "0")
            echo "✅ Safe balance: $BALANCE_ETH ETH"
            echo "| Safe Address | \`$SAFE_ADDRESS\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Balance | $BALANCE_ETH ETH |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Run forge build
        id: build
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "🔨 Running forge build..."

          if forge build; then
            echo "✅ Build successful"
            echo "| forge build | :white_check_mark: Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Build failed"
            echo "| forge build | :x: Failed |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Run forge tests with fork
        id: test
        if: ${{ inputs.skip_tests != true }}
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "🧪 Running forge tests with OP Sepolia fork..."

          if forge test --fork-url "${{ secrets.OP_SEPOLIA_RPC_URL }}" -vvv; then
            echo "✅ All tests passed"
            echo "| forge test (fork) | :white_check_mark: All tests passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Tests failed"
            echo "| forge test (fork) | :x: Tests failed |" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Skip tests notice
        if: ${{ inputs.skip_tests == true }}
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏭️ Tests skipped by user request"
          echo "| forge test (fork) | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Generate summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary Table" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Configured | ${{ steps.check-secrets.outcome == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RPC Connection | ${{ steps.verify-rpc.outcome == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Safe Balance Check | ${{ steps.check-safe.outcome == 'success' && ':white_check_mark:' || ':warning:' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.skip_tests }}" = "true" ]; then
            echo "| Tests | :fast_forward: Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Tests | ${{ steps.test.outcome == 'success' && ':white_check_mark:' || ':x:' }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Workflow triggered at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')_" >> $GITHUB_STEP_SUMMARY
