# QUARANTINED 2026-07-27 — this workflow does not test what its name claims.
#
# It targets OP Sepolia, which was deprecated on 2026-06-27 and is marked
# "status": "archived" in deployment-addresses.json. The live chain is Base
# Sepolia (84532). Worse, test/fork/ForkBase.t.sol:89 asserts
# block.chainid == 10 — OP *Mainnet* — and pins FORK_BLOCK = 125000000, so
# the --fork-url passed below is ignored: ForkBase calls vm.createFork()
# itself against OP_MAINNET_RPC_URL.
#
# It has failed 40 consecutive scheduled runs since 2026-06-17 with
# "403 OPT_SEPOLIA is not enabled for this app" — the Alchemy app lost the
# network. A daily red X on a public repo, for a chain we no longer use.
#
# The schedule is removed rather than the workflow deleted: the code-exists
# check below is worth keeping once retargeted. Retargeting to Base Sepolia
# requires a BASE_SEPOLIA_RPC_URL repo secret (does not exist yet) and a
# rewrite of ForkBase.t.sol to chainid 84532 with Base constants. Tracked as
# Wave 1. Until then this runs on demand only and its result should not be
# read as coverage of the live deployment.
#
# See KNOWN-ISSUES.md (KI-06) and AUDIT-SCOPE.md §5.
name: Fork Tests (OP Sepolia) — QUARANTINED, targets an archived chain

on:
  workflow_dispatch:       # Manual only. Schedule removed 2026-07-27, see above.

jobs:
  fork-test:
    name: Test against live OP Sepolia state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run fork tests
        env:
          OP_SEPOLIA_RPC_URL: ${{ secrets.OP_SEPOLIA_RPC_URL }}
        run: |
          if [ -z "$OP_SEPOLIA_RPC_URL" ]; then
            echo "::warning::OP_SEPOLIA_RPC_URL not set, using public endpoint"
            export OP_SEPOLIA_RPC_URL="https://sepolia.optimism.io"
          fi
          forge test --fork-url "$OP_SEPOLIA_RPC_URL" -v --fuzz-runs 1000

      - name: Verify deployed contracts have code
        env:
          OP_SEPOLIA_RPC_URL: ${{ secrets.OP_SEPOLIA_RPC_URL }}
        run: |
          RPC="${OP_SEPOLIA_RPC_URL:-https://sepolia.optimism.io}"
          CONTRACTS=(
            "TAGITCore:0x8BdE22da889306d422802728cb98B6Da42ed8e1a"
            "TAGITTreasury:0xf6f5e2e03f6e28aE9Dc17bCc814a0cf758c887c9"
            "TAGITPaymaster:0x4339c46D63231063250834D9b3fa4E51FdB8026e"
            "TAGITRecovery:0x6138a80c06A5e6a3CB6cc491A3a2c4DF4adD1600"
          )

          for entry in "${CONTRACTS[@]}"; do
            NAME="${entry%%:*}"
            ADDR="${entry##*:}"
            CODE=$(cast code "$ADDR" --rpc-url "$RPC" 2>/dev/null || echo "0x")
            if [ "$CODE" = "0x" ] || [ -z "$CODE" ]; then
              echo "::error::$NAME ($ADDR) has no code!"
              exit 1
            else
              echo "$NAME: OK (${#CODE} bytes)"
            fi
          done
