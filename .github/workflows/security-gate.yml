name: Security Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'foundry.toml'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: forge build --sizes

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run tests
        run: forge test -v --fuzz-runs 10000

      - name: Run security patch tests
        run: forge test --match-path "test/security/*" -vv --fuzz-runs 100000

  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build for Slither
        run: forge build

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          slither-args: >-
            --filter-paths "test|script|lib"
            --exclude naming-convention,solc-version,pragma

  gas-check:
    name: Gas Snapshot
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Gas snapshot
        run: forge snapshot

      - name: Compare gas
        run: |
          if [ -f .gas-snapshot ]; then
            forge snapshot --check || echo "::warning::Gas regression detected"
          else
            echo "No previous snapshot to compare"
          fi
