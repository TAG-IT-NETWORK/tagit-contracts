name: Security Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'foundry.toml'
      - '.github/workflows/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      # Deploy profile (via-ir) — the shipped codegen; TAGITCore only fits
      # EIP-170 under it (see foundry.toml [profile.deploy] comment).
      - name: Build contracts (EIP-170 size gate, deploy profile)
        run: forge build --sizes
        env:
          FOUNDRY_PROFILE: deploy

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Run tests
        run: forge test -v --fuzz-runs 10000

      - name: Run security patch tests
        run: forge test --match-path "test/security/*" -vv --fuzz-runs 100000

  # Slither runs as the REQUIRED gate in .github/workflows/security.yml
  # (job "Slither Static Analysis"): `slither . --config-file slither.config.json
  # --exclude-dependencies --fail-high` — the single source of truth, failing only on
  # HIGH-severity findings. The duplicate job that used to live here ran a second,
  # inconsistent Slither config without --fail-high, so it failed on every PR over the
  # ~175 pre-existing low/informational findings (KI-13) and, being continue-on-error,
  # could never block anyway. Removed to end the permanent-red noise.

  gas-check:
    name: Gas Snapshot
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Gas snapshot
        run: forge snapshot

      - name: Compare gas
        run: |
          if [ -f .gas-snapshot ]; then
            forge snapshot --check || echo "::warning::Gas regression detected"
          else
            echo "No previous snapshot to compare"
          fi
