name: Security Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither-analysis:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Slither
        # Pinned for reproducible results (detector set + severities are version-dependent).
        run: pip install slither-analyzer==0.11.5

      - name: Run Slither
        # Advisory gate: print every finding, but only FAIL the check on HIGH-severity
        # issues (--fail-high). The ~180 low/informational results (naming, dead-code,
        # low-level-calls, immutable-suggestions) are reviewed in the log, not blockers.
        #
        # slither.config.json excludes ONLY the two `arbitrary-send-*` detectors: this
        # codebase's architecture inherently and correctly trips them —
        #   • TAGITAccount._call / _payPrefund  → ERC-4337, gated by onlyEntryPointOrOwner
        #   • OfferEscrow.fundOffer             → enforces msg.sender == offer.buyer + EIP-712
        #   • TAGITTreasury.emergencySweep      → 6/8 multisig over a hash binding `to` + nonce
        #   • CCIPAdapter._sendResponse         → pays fees to the trusted Chainlink router
        # All five current hits were manually reviewed as false positives. Every other
        # HIGH detector (reentrancy-eth, delegatecall, suicidal, unchecked-transfer…)
        # still fails the gate.
        run: slither . --config-file slither.config.json --exclude-dependencies --fail-high

  forge-tests:
    name: Forge Tests (10k Fuzz Runs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Build
        run: forge build

      - name: Run tests
        run: forge test --fuzz-runs 10000

  forge-coverage:
    name: Forge Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Run coverage
        # Exclude gas-budget benchmarks (test_*gasEfficiency): `forge coverage`
        # disables the optimizer, which inflates measured gas ~4% and makes hard
        # gas assertions fail spuriously (e.g. 215,284 vs a 215,000 budget).
        # Coverage measures line/branch reach, not gas — these paths are still
        # fully exercised by the lifecycle unit/integration tests.
        run: forge coverage --report lcov --no-match-test 'gasEfficiency'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info

  halmos-verification:
    name: Halmos Formal Verification
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Halmos
        run: pip install halmos

      - name: Install dependencies
        run: forge install

      - name: Run Halmos
        # Skip the check_BatchMint_* properties: Halmos cannot symbolically execute
        # functions that take dynamic-length array calldata (it raises an internal
        # NotConcreteError on the symbolic CALLDATACOPY size), so they error rather
        # than verify. Those batch paths are covered by fuzz + invariant tests.
        # All other StateInvariants properties are still symbolically verified.
        run: halmos --contract StateInvariants --match-test '^check_(?!BatchMint)' --solver-timeout-assertion 120

  mythril-analysis:
    name: Mythril Analysis (Optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Build
        run: forge build

      - name: Pull Mythril Docker image
        run: docker pull mythril/myth

      - name: Run Mythril
        run: >
          docker run -v ${{ github.workspace }}:/src
          mythril/myth analyze
          /src/src/core/TAGITCore.sol
          --execution-timeout 90

  stride-tests:
    name: STRIDE Attack Vector Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Run STRIDE tests
        run: forge test --match-contract STRIDEAttackVectors -vvv
